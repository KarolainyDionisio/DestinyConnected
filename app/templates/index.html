<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DestinyConnected</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            flex-direction: column; 
            overflow: hidden;
        }

        .navbar {
            width: 100%;
            background-color: #4CAF50;
            padding: 15px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
            transition: all 0.3s ease; 
        }
        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            text-decoration: none;
            color: white;
            padding: 10px 15px;
            font-size: 16px;
            margin-right: 15px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .navbar a:hover {
            background-color: #45a049;
        }



  
        .content {
            text-align: center;
            z-index: 5; 
        }
        .floating-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
            animation: float 3s ease-in-out infinite;
            transform-origin: center;
            display: inline-block;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
            100% {
                transform: translateY(0);
            }
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        ul li {
            margin: 15px 0;
        }

        ul li a {
            text-decoration: none;
            color: #4CAF50;
            font-size: 18px;
            transition: color 0.3s ease;
        }

        ul li a:hover {
            color: #45a049;
        }


        .navbar.hidden {
            height: 0;
            opacity: 0;
        }

        .content.navbar-hidden {
            margin-top: 20px;
        }

    </style>
</head>
<body>
    <div class="navbar" id="navbar">
        <button class="toggle-btn" id="toggle-btn">&#8595;</button>
        <h2>DestinyConnected</h2>
        <div class="links">
            <a href="cadastro.html">Fazer Cadastro</a>
            <a href="login.html">Logar</a>
            <a href="viagem.html">Viagem</a>
            <a href="reserva.html">Fazer uma Reserva</a>
            <a href="avaliacao.html">Avaliar uma Viagem</a>
            <a href="usuario.html">Perfil do usuário</a>
        </div>
    </div>

    <div class="content" id="content">
        <h1 class="floating-text">Bem-vindo ao DestinyConnected!</h1>
        <p class="floating-text">Agradecemos a preferência! Para onde iremos hoje?.</p>

    </div>


   
</body>
</html>
