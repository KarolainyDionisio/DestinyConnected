<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DestinyConnected - Avaliações</title>
    <style>
            body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            flex-direction: column; 
            overflow: hidden;
        }

        .navbar {
            width: 100%;
            background-color: #4CAF50;
            padding: 15px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
            transition: all 0.3s ease; 
        }
        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            text-decoration: none;
            color: white;
            padding: 10px 15px;
            font-size: 16px;
            margin-right: 15px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .navbar a:hover {
            background-color: #45a049;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            color: #333;
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 20px;
        }

        table {
            width: 80%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        td {
            background-color: #f9f9f9;
        }

        .review-form {
            width: 80%;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 40px;
        }

        .review-form input, .review-form textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        .review-form button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        .review-form button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="navbar" id="navbar">
        <button class="toggle-btn" id="toggle-btn">&#8595;</button>
        <h2>DestinyConnected</h2>
        <div class="links">
            <a href="index.html">Inicio</a>
            <a href="viagem.html">Viagem</a>
            <a href="reserva.html">Fazer uma Reserva</a>
            <a href="cadastro.html">Fazer Cadastro</a>
            <a href="login.html">Logar</a>
            <a href="usuario.html">Perfil do usuário</a>
        </div>
    </div>
<body>

    <h1>Avaliações</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Viagem</th>
                <th>Usuário</th>
                <th>Comentário</th>
            </tr>
        </thead>
        <tbody>
            {% for avaliacao in avaliacao %}
                <tr>
                    <td>{{ avaliacao.id }}</td>
                    <td>{{ avaliacao.viagem.nome }}</td> 
                    <td>{{ avaliacao.usuario }}</td>
                    <td>{{ avaliacao.comentario }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="review-form">
        <h2>Deixe sua avaliação</h2>
        <label for="email">Seu E-mail:</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required><br>

        <label for="comment">Comentário:</label>
        <textarea id="comment" rows="4" placeholder="Deixe seu comentário aqui" required></textarea><br>

        <button type="submit" onclick="submitReview()">Enviar Avaliação</button>
    </div>

    <script>
        function submitReview() {
            const email = document.getElementById('email').value;
            const comment = document.getElementById('comment').value;

            if (!email || !comment) {
                alert('Por favor, preencha todos os campos!');
                return;
            }

            alert(`Avaliação enviada!`);

            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td>Nova</td>
                <td>Viagem Exemplo</td>
                <td>${email}</td>
                <td>${comment}</td>
            `;
            document.querySelector('tbody').appendChild(newRow);

            document.getElementById('email').value = '';
            document.getElementById('comment').value = '';
        }
    </script>

</body>
</html>
